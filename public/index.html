<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ubuntu Web Terminal</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            background: #111;
            color: white;
            font-family: sans-serif;
            overflow: hidden;
        }

        #login {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            width: 320px;
            padding: 30px;
            background: #1e1e1e;
            border-radius: 10px;
            box-sizing: border-box;
        }

        .box h2 {
            margin-top: 0;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            background: #111;
            color: white;
            border: 1px solid #555;
            border-radius: 5px;
            margin: 10px 0;
        }

        button {
            width: 100%;
            padding: 12px;
            cursor: pointer;
            border: 0;
            border-radius: 5px;
        }

        #error {
            color: #ff6b6b;
            min-height: 20px;
        }

        #terminal {
            width: 100%;
            height: 100%;
            padding: 10px;
            box-sizing: border-box;
            display: none;
        }
    </style>
</head>

<body>

<div id="login">
    <div class="box">
        <h2>Ubuntu Web Terminal</h2>

        <input
            id="password"
            type="password"
            placeholder="Password"
            autocomplete="current-password"
        >

        <button id="loginButton">Login</button>

        <div id="error"></div>
    </div>
</div>

<div id="terminal"></div>

<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>

<script>
    const login = document.getElementById("login");
    const terminalElement = document.getElementById("terminal");
    const passwordInput = document.getElementById("password");
    const loginButton = document.getElementById("loginButton");
    const error = document.getElementById("error");

    async function doLogin() {
        const password = passwordInput.value;

        if (!password) {
            error.textContent = "Enter password.";
            return;
        }

        error.textContent = "";
        loginButton.disabled = true;

        try {
            const response = await fetch("/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ password })
            });

            const data = await response.json();

            if (!response.ok) {
                error.textContent = "Invalid password.";
                loginButton.disabled = false;
                passwordInput.select();
                return;
            }

            startTerminal(data.token);

        } catch (err) {
            error.textContent = "Connection error.";
            loginButton.disabled = false;
        }
    }

    function startTerminal(token) {
        login.style.display = "none";
        terminalElement.style.display = "block";

        const terminal = new Terminal({
            cursorBlink: true,
            fontSize: 16,
            convertEol: true,
            scrollback: 5000
        });

        terminal.open(terminalElement);
        terminal.focus();

        const protocol = location.protocol === "https:" ? "wss:" : "ws:";
        const socket = new WebSocket(
            `${protocol}//${location.host}?token=${encodeURIComponent(token)}`
        );

        socket.onopen = () => {
            terminal.write(
                "\r\nConnected to Ubuntu container.\r\n\r\n"
            );
            terminal.focus();
        };

        socket.onmessage = (event) => {
            terminal.write(event.data);
        };

        socket.onclose = () => {
            terminal.write(
                "\r\n\r\nConnection closed.\r\n"
            );
        };

        socket.onerror = () => {
            terminal.write(
                "\r\n\r\nWebSocket error.\r\n"
            );
        };

        terminal.onData((data) => {
            if (socket.readyState === WebSocket.OPEN) {
                socket.send(data);
            }
        });

        window.addEventListener("resize", () => {
            terminal.focus();
        });

        terminalElement.addEventListener("click", () => {
            terminal.focus();
        });
    }

    loginButton.addEventListener("click", doLogin);

    passwordInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
            doLogin();
        }
    });

    passwordInput.focus();
</script>

</body>
</html>
